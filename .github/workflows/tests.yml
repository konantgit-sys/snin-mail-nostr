name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx2

      - name: Clone nostr-mail-bridge (mailbridge package)
        run: git clone --depth 1 https://github.com/konantgit-sys/nostr-mail-bridge.git /tmp/nostr-mail-bridge

      - name: Install bridge dependencies (secp256k1, pycryptodome, …)
        run: pip install -r /tmp/nostr-mail-bridge/requirements.txt

      - name: Run test suite (115 tests, self-contained — config.json is generated by conftest)
        run: |
          export PYTHONPATH=/tmp/nostr-mail-bridge/src:/tmp/nostr-mail-bridge/deps
          python -m pytest tests/ -q
